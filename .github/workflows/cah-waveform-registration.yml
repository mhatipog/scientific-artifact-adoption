name: CAH published waveform synchronization
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cah-statics/empirical/waveform_registration/**'
      - '.github/workflows/cah-waveform-registration.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible numerical libraries
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'Pillow>=10,<13' 'matplotlib>=3.8,<4'
      - name: Install PDF tool only for explicit manual original-source validation
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Retrieve and render author manuscript only for explicit manual original-source validation
        if: github.event_name == 'workflow_dispatch'
        run: python cah-statics/empirical/waveform_registration/figure_source.py
      - name: Re-match every original FISO sensor recording, time shift only
        if: github.event_name == 'workflow_dispatch'
        run: python cah-statics/empirical/waveform_registration/align_published.py
      - name: Reproduce experimental camera-versus-sensor time bridge from source or frozen traces
        run: python cah-statics/empirical/waveform_registration/bridge_camera_pressure.py
      - name: Preserve derived plots and offset/uncertainty audit for seven days
        uses: actions/upload-artifact@v4
        with:
          name: cah-clock-bridge-model-free
          path: cah-statics/empirical/waveform_registration/outputs/
          retention-days: 7
