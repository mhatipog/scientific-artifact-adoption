name: CAH published waveform synchronization
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cah-statics/empirical/waveform_registration/**'
      - '.github/workflows/cah-waveform-registration.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight PDF processing
        run: python -m pip install 'pymupdf>=1.24,<2' 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'Pillow>=10,<13' 'matplotlib>=3.8,<4'
      - name: Obtain author's CC-BY paper and crop experiment Figure 5
        run: python cah-statics/empirical/waveform_registration/figure_source.py
      - name: Independently register the three original raw FISO recordings to the paper waveforms
        run: python cah-statics/empirical/waveform_registration/align_published.py
      - name: Keep only short-lived derived manuscript figure and provenance
        uses: actions/upload-artifact@v4
        with:
          name: cah-published-waveform-audit
          path: cah-statics/empirical/waveform_registration/outputs
          retention-days: 7
