name: CAH experiment — DaRUS pressure audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cah-statics/empirical/**'
      - '.github/workflows/cah-empirical-data.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch 3 low-flow pressure files and check structure, no fitting
        run: python cah-statics/empirical/audit_darus.py
      - name: Produce annotated SVG from measured pressure recordings
        run: python cah-statics/empirical/plot_pressure_svg.py
      - name: Predict nominal rounded-corner pressure barrier (no fitting)
        run: python cah-statics/empirical/yan_entry_forward.py
      - name: Index Q1 video frame ranges, without downloading TIFFs
        run: python cah-statics/empirical/yan_video_index.py
      - name: Check bounded TIFF byte-range access (no video download)
        run: python cah-statics/empirical/yan_tiff_range_probe.py
      - name: Install limited image decoding dependencies
        run: pip install 'numpy>=1.26,<3' 'tifffile>=2024.7' 'pillow>=10,<13' 'scipy>=1.12,<2' 'matplotlib>=3.8,<4' 'opencv-python-headless>=4.10,<5'
      - name: Read selected 120-degree video frames only via HTTP ranges
        run: python cah-statics/empirical/yan_sparse_frames.py
      - name: Independent microscope curvature vs sensor cross-modal diagnostic
        run: python cah-statics/empirical/yan_crossmodal.py
      - uses: actions/upload-artifact@v4
        with:
          name: cah-independent-pressure-data-audit
          path: |
            cah-statics/empirical/outputs/empirical/darus_lowflow_pressure_audit.json
            cah-statics/empirical/outputs/empirical/measured_pressure_traces.svg
            cah-statics/empirical/outputs/empirical/yan_*
            cah-statics/empirical/outputs/empirical/yan_frames/*.png
          retention-days: 7
