name: CAH finite-depth Young-Laplace benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cah-statics/round5_3d/**'
      - '.github/workflows/cah-round5-3d.yml'

concurrency:
  group: cah-3d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  finite-depth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cah-statics/round5_3d/requirements.txt
      - run: python -m pip install -r cah-statics/round5_3d/requirements.txt
      - name: Verify straight and neutral Young-Laplace limits and all-parity stability
        run: python cah-statics/round5_3d/test_round5.py
      - name: Generate documented comparative figure from saved model outputs
        run: python cah-statics/round5_3d/figures_round5.py
      - name: Archive figure only
        uses: actions/upload-artifact@v4
        with:
          name: cah-round5-3d-model-figure
          path: |
            cah-statics/round5_3d/round5_3d_validation.png
            cah-statics/round5_3d/round5_3d_validation.svg
          retention-days: 7
