name: CAH statics — reproducible figures

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cah-statics/model.py'
      - 'cah-statics/tests/**'
      - 'cah-statics/plot.py'
      - 'cah-statics/audit_pore.py'
      - 'cah-statics/bifurcation.py'
      - 'cah-statics/phase_isospectral.py'
      - 'cah-statics/young_laplace_depth.py'
      - 'cah-statics/requirements.txt'
      - 'cah-statics/ROUND*.md'
      - '.github/workflows/cah-statics.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cah-statics/requirements.txt
      - run: python -m pip install -r cah-statics/requirements.txt
      - name: Verify internal mathematical consistency
        run: PYTHONPATH=cah-statics python cah-statics/tests/test_model.py
      - name: Regenerate explanatory figures and model table
        run: python cah-statics/plot.py
      - name: Reproduce explicitly approximate Yan figure diagnostic
        run: python cah-statics/audit_pore.py
      - name: Check analytical symmetry-breaking classification and regenerate phase diagram
        run: python cah-statics/bifurcation.py
      - name: Check phase-sensitive isospectral channel counterexample
        run: python cah-statics/phase_isospectral.py
      - name: Independently check planar Young-Laplace and finite-depth stationarity benchmark
        run: python cah-statics/young_laplace_depth.py
      - name: Test linearized three-dimensional plate and corner wetting constraints
        run: python cah-statics/plate_corner_response.py
      - name: Verify sixth-order phase-only roughness counterexample
        run: python cah-statics/spectrum_phase_sixthorder.py
      - name: Verify arbitrary-order isocorrelation and local capillary instability theorem
        run: python cah-statics/arbitrary_order_capillary_theorem.py
      - name: Archive reproducible outputs (never claim empirical fit)
        uses: actions/upload-artifact@v4
        with:
          name: cah-statics-model-only
          path: cah-statics/outputs/
          retention-days: 7
