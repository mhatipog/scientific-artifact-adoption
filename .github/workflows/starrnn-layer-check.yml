name: StarRNN layer identity check

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU PyTorch
        run: python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Original BreizhCrops at historical commit
        uses: actions/checkout@v4
        with:
          repository: dl4sits/BreizhCrops
          ref: 6de796ed36a457c8520322d6110b8f2862fd8c25
          path: original
      - name: Proposed isolated StarRNN patch
        uses: actions/checkout@v4
        with:
          repository: mhatipog/BreizhCrops
          ref: fix-starrnn-independent-layers
          path: patched
      - name: Check real source, layer identity and gradients
        shell: bash
        run: |
          mkdir -p workflow-results
          python - <<'PY'
          import pathlib, importlib.util, torch, json, hashlib, difflib
          original = pathlib.Path("original/breizhcrops/models/StarRNN.py")
          patched = pathlib.Path("patched/breizhcrops/models/StarRNN.py")
          s1 = original.read_text()
          s2 = patched.read_text()
          old = '*[StarLayer(input_dim=hidden_dims, hidden_dim=hidden_dims, droput_factor=dropout, device=device)] * (num_layers-1)'
          new = '*[StarLayer(input_dim=hidden_dims, hidden_dim=hidden_dims, droput_factor=dropout, device=device) for _ in range(num_layers-1)]'
          assert s1.count(old) == 1
          assert s2 == s1.replace(old, new), "unexpected differences"
          def make_model(path, name):
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              torch.manual_seed(42)
              return mod.StarRNN(input_dim=4, num_classes=3, hidden_dims=8, num_layers=3, dropout=0)
          a = make_model(original, "starrnn_original")
          b = make_model(patched, "starrnn_patched")
          assert a.block[1] is a.block[2]
          assert b.block[1] is not b.block[2]
          assert a.block[1].cell.x_K.weight.data_ptr() == a.block[2].cell.x_K.weight.data_ptr()
          assert b.block[1].cell.x_K.weight.data_ptr() != b.block[2].cell.x_K.weight.data_ptr()
          na = dict(a.named_parameters())
          nb = dict(b.named_parameters())
          assert 'block.2.cell.x_K.weight' not in na
          assert 'block.2.cell.x_K.weight' in nb
          x = torch.randn(4, 8, 4)
          y = torch.tensor([0, 1, 2, 1])
          b.train()
          loss = torch.nn.functional.nll_loss(b(x), y)
          loss.backward()
          assert b.block[1].cell.x_K.weight.grad is not None
          assert b.block[2].cell.x_K.weight.grad is not None
          record = {
              "original_source_git_sha": "6de796ed36a457c8520322d6110b8f2862fd8c25",
              "source_sha256": hashlib.sha256(original.read_bytes()).hexdigest(),
              "patch_only_one_constructor_expression": True,
              "original_depth3_layers_1_2_share_identity": a.block[1] is a.block[2],
              "patched_depth3_layers_1_2_share_identity": b.block[1] is b.block[2],
              "original_trainable_parameters": sum(p.numel() for p in a.parameters()),
              "patched_trainable_parameters": sum(p.numel() for p in b.parameters()),
              "both_patched_deep_layers_have_gradients": True,
              "note": "Checks model construction and gradients, NOT crop classification performance."
          }
          pathlib.Path('workflow-results/starrnn-layer-identity.json').write_text(json.dumps(record, indent=2)+'\n')
          print(json.dumps(record, indent=2))
          PY
      - name: Check official StarRNN checkpoint on both module structures
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, importlib.util, torch, urllib.request, io, re, hashlib, json
          def make_model(path, name):
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod.StarRNN(input_dim=13, num_classes=9, num_layers=3, hidden_dims=128,
                                 bidirectional=False, use_batchnorm=False, use_layernorm=True,
                                 device=torch.device('cpu'))
          pretrained_file = pathlib.Path('original/breizhcrops/models/pretrained.py').read_text()
          match = re.search(r'^STARRNN_URL = "([^"]+)"', pretrained_file, re.MULTILINE)
          assert match, 'No StarRNN URL in original source'
          url = match.group(1)
          assert url.startswith('https://breizhcrops.s3.eu-central-1.amazonaws.com/models/eval/StarRNN/')
          req = urllib.request.Request(url, headers={'User-Agent': 'scientific-reproduction/1.0'})
          with urllib.request.urlopen(req, timeout=60) as stream:
              raw = stream.read(30*1024*1024+1)
          assert len(raw) <= 30*1024*1024, 'Unexpected checkpoint size'
          checkpoint = torch.load(io.BytesIO(raw), map_location='cpu', weights_only=True)
          state = checkpoint['model_state']
          orig = make_model('original/breizhcrops/models/StarRNN.py', 'starrnn_old')
          fixed = make_model('patched/breizhcrops/models/StarRNN.py', 'starrnn_fixed')
          orig.load_state_dict(state, strict=True)
          fixed.load_state_dict(state, strict=True)
          orig.eval()
          fixed.eval()
          torch.manual_seed(11)
          x = torch.rand(4, 45, 13)
          with torch.inference_mode():
              a = orig(x)
              b = fixed(x)
          max_delta = float((a-b).abs().max().item())
          assert max_delta <= 1e-6, f'Unexpected checkpoint prediction mismatch: {max_delta}'
          assert orig.block[1] is orig.block[2]
          assert fixed.block[1] is not fixed.block[2]
          data = {
              'official_checkpoint_url_from_source': url,
              'checkpoint_sha256': hashlib.sha256(raw).hexdigest(),
              'checkpoint_bytes': len(raw),
              'checkpoint_state_load_original_strict': True,
              'checkpoint_state_load_independent_layers_strict': True,
              'same_pretrained_predictions_on_synthetic_inputs': True,
              'max_abs_log_probability_difference': max_delta,
              'original_trainable_parameter_count': sum(p.numel() for p in orig.parameters()),
              'patched_trainable_parameter_count': sum(p.numel() for p in fixed.parameters()),
              'limitations': 'Confirms one official checkpoint can be loaded and predictions match. Does NOT compare retrained accuracy on real crops.'
          }
          pathlib.Path('workflow-results/starrnn-checkpoint.json').write_text(json.dumps(data, indent=2)+'\n')
          print(json.dumps(data, indent=2))
          PY
      - name: Upload source comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starrnn-layer-check
          path: workflow-results/*.json
          retention-days: 14
          if-no-files-found: warn
