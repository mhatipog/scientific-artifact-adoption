name: PANGAEA pinned-source metric invariance
on:
  push:
    branches: [research/pangaea-regression-invariance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch original pinned upstream Git commit
        shell: bash
        run: |
          git init /tmp/pangaea-upstream
          git -C /tmp/pangaea-upstream remote add origin https://github.com/VMarsocci/pangaea-bench.git
          git -C /tmp/pangaea-upstream fetch --depth 1 origin ca19b837a16797cd809225225b671473c7c93768
          git -C /tmp/pangaea-upstream checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pangaea-upstream rev-parse HEAD)" = ca19b837a16797cd809225225b671473c7c93768
          test "$(git -C /tmp/pangaea-upstream hash-object pangaea/engine/evaluator.py)" = 345e7b33a471134e2d1a5bd3f1d28c9d5776b73c
      - name: Install CPU PyTorch only (no original training dependencies)
        run: python -m pip install 'torch==2.10.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Generate guarded upstream patch and check clean application
        run: |
          python pangaea/write_regression_patch.py --repo /tmp/pangaea-upstream --out /tmp/pangaea-mse.patch
          git -C /tmp/pangaea-upstream apply --check /tmp/pangaea-mse.patch
      - name: Test actual evaluator with alternate batch sizes
        run: python -u pangaea/pinned_regression_check.py --repo /tmp/pangaea-upstream --mode single --results /tmp/invariance-single.json
      - name: Test actual evaluator with two real CPU distributed ranks
        env:
          OMP_NUM_THREADS: "1"
        run: python -m torch.distributed.run --standalone --nproc_per_node=2 pangaea/pinned_regression_check.py --repo /tmp/pangaea-upstream --mode distributed --results /tmp/invariance-two-rank.json
      - name: Install metric-reference library
        run: python -m pip install scikit-learn==1.8.0
      - name: Verify segmentation and multilabel metric semantics on actual source
        run: python -u pangaea/actual_source_metric_contracts.py --repo /tmp/pangaea-upstream --out /tmp/pangaea-other-metrics.json
      - name: Preserve reproducible numerical proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pangaea-original-evaluator-invariance
          path: |
            /tmp/invariance-single.json
            /tmp/invariance-two-rank.json
            /tmp/pangaea-mse.patch
            /tmp/pangaea-other-metrics.json
          if-no-files-found: ignore
          retention-days: 60
